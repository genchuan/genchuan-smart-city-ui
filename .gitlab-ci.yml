stages:
  - build

build:
  stage: build
  tags:
    - genchuan-ui-runner
  script:
    - echo "===== 开始安装依赖并构建项目 ====="
    - pnpm config set registry https://registry.npmjs.org/
    - pnpm install --no-frozen-lockfile
    - pnpm run build:ele
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

