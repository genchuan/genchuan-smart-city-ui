stages:
  - build
  - push
variables:
  DIST_PATH: "./apps/web-ele/dist"
  TARGET_PATH: "/data/vue/"
  DEV_PATH: "/data/dev/vue/"
  PIPELINE_TAG: "$CI_COMMIT_BRANCH"

build:
  stage: build
  tags:
    - genchuan-ui-runner
  script:
    - echo "===== 开始安装依赖并构建项目 ====="
    - pnpm config set registry https://registry.npmjs.org/
    - pnpm install --no-frozen-lockfile
    - pnpm run build:ele
  artifacts:
    paths:
      - $DIST_PATH/
    expire_in: 1h
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
push:
  stage: push
  tags:
    - genchuan-ui-runner
  needs:
    - build
  script:
    - echo "===== 当前分支：$PIPELINE_TAG ====="
    - echo "===== 开始迁移 dist 包 ====="
    - |
      if [ "$PIPELINE_TAG" = "master" ]; then
        echo "master 分支：直接部署到 $TARGET_PATH"
        cp -rf $DIST_PATH/* $TARGET_PATH/
      else
        echo "非 master 分支：部署到 $DEV_PATH$PIPELINE_TAG"
        mkdir -p $DEV_PATH$PIPELINE_TAG
        cp -rf $DIST_PATH/* $DEV_PATH$PIPELINE_TAG/
      fi
    - echo "===== 迁移完成 ====="
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
