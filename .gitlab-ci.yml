stages:
  - build
  - push
  - deploy

variables:
  DIST_PATH: "./apps/web-ele/dist"
  TARGET_PATH: "/home/gitlab-runner/vue/vue-vben"
  DOCKER_IMAGE: "192.168.8.14/genchuan/genchuan-ui"
  PIPELINE_TAG: "$CI_COMMIT_BRANCH"

build:
  stage: build
  script:
    - echo "===== 开始安装依赖并构建项目 ====="
    - pnpm config set registry https://registry.npmjs.org/
    - pnpm install --no-frozen-lockfile
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev-urban" ]; then
        echo "===== dev-urban 分支：执行构建 ele-dev ====="
        pnpm run build:ele-dev
      else
        echo "===== 其他分支：执行构建 ele ====="
        pnpm run build:ele
      fi
  artifacts:
    paths:
      - $DIST_PATH/
    expire_in: 1h
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
push:
  stage: push
  tags:
    - git-runner-01
  only:
    - dev-urban
  needs:
    - build
  script:
    - echo "===== 开始迁移dist包到目标服务器 ====="
    - mkdir -p $TARGET_PATH
    - cp -rf $DIST_PATH/* $TARGET_PATH/
    - echo "dist包已迁移到本地路径：$TARGET_PATH"
    # 验证迁移结果
    - ls -l $TARGET_PATH  # 本地迁移验证
    # - ssh $SSH_USER@$TARGET_SERVER "ls -l $TARGET_PATH"  # 远程迁移验证
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
deploy:
  stage: deploy
  tags:
    - git-runner-01
  only:
    - master
  needs:
    - build
  script:
    - echo "===== 构建镜像====="
    - docker build -t $DOCKER_IMAGE:$PIPELINE_TAG .
    - echo "===== 推送镜像====="
    - docker push $DOCKER_IMAGE:$PIPELINE_TAG
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
