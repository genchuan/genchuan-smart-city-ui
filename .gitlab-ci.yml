stages:
  - build
  - push

variables:
  DIST_PATH: "./apps/web-ele/dist"
  # TARGET_SERVER: "你的目标服务器IP/域名"  # 接收dist包的服务器
  # SSH_USER: "root"
  # SSH_PASSWORD: "你的密码" 或 使用SSH密钥
  TARGET_PATH: "/home/gitlab-runner/vue/vue-vben"

build:
  stage: build
  script:
    - echo "===== 开始安装依赖并构建项目 ====="
    - pnpm config set registry https://registry.npmjs.org/
    - pnpm install --no-frozen-lockfile
    - pnpm run build:ele
    - pwd
    - ls -l $DIST_PATH
  artifacts:
    paths:
      - $DIST_PATH/
    expire_in: 1h
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

# 第二阶段：迁移dist包（仅dev-urban分支执行）
push:
  stage: push
  tags:
    - git-runner-01
  only:
    - dev-urban
  needs:
    - build
  script:
    - echo "===== 开始迁移dist包到目标服务器 ====="
    - mkdir -p $TARGET_PATH
    - cp -rf $DIST_PATH/* $TARGET_PATH/
    - echo "dist包已迁移到本地路径：$TARGET_PATH"
    # 验证迁移结果
    - ls -l $TARGET_PATH  # 本地迁移验证
    # - ssh $SSH_USER@$TARGET_SERVER "ls -l $TARGET_PATH"  # 远程迁移验证
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
