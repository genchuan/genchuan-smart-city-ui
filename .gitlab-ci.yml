image: harbor.genchuan.cn/library/node:v20.15.0-alpine-docker-pnpm

# 定义两个独立的阶段：先构建，后推送
stages:
  - buildAndPush

variables:
  DOCKER_IMAGE: ""
  HARBOR_USER: ""
  HARBOR_PASSWORD: ""
  PIPELINE_TAG: "$CI_COMMIT_BRANCH"

# 第一阶段：构建（所有分支执行）
build:
  stage: buildAndPush
  script:
    - echo "安装依赖并构建项目..."
    - pnpm config set registry https://registry.npmjs.org/
    - pnpm install
    - pnpm run build:ele
        # 仅当分支是dev-urban时，才执行Docker推送逻辑
    - |
      if [ "$CI_COMMIT_BRANCH" == "saas-urban" ]; then
        echo "登录 Harbor 仓库..."
        docker login -u $HARBOR_USER -p $HARBOR_PASSWORD harbor.genchuan.cn

        echo "构建 Docker 镜像..."
        docker build -t $DOCKER_IMAGE:$PIPELINE_TAG .

        echo "推送 Docker 镜像..."
        docker push $DOCKER_IMAGE:$PIPELINE_TAG
      else
        echo "当前分支不是开发分支，跳过Docker推送步骤"
      fi

  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
